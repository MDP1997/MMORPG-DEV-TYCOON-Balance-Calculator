<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MMORPG Calculator</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>

  <!-- Language switch -->
  <div class="language-switch" aria-label="Language selector">
    <button id="lang-es" class="lang-btn" type="button" title="Español">ES</button>
    <button id="lang-en" class="lang-btn" type="button" title="English">EN</button>
  </div>

  <!-- Top bar — now acts as main nav tab bar -->
  <div id="topBar"></div>

  <!-- Main view — shown instead of .app when a non-characters view is active -->
  <div id="mainView"></div>

  <!-- App view — characters builder (sidebar + content) -->
  <div class="app" id="appView">
    <div class="sidebar">
      <button id="btnAddCharacter" class="primary-btn full-width" type="button">
        ➕ <span data-i18n="addCharacter"></span>
      </button>
      <div id="characterList"></div>
    </div>
    <div class="content" id="content">
      <p data-i18n="selectCharacter"></p>
    </div>
  </div>

  <!-- Modal roots -->
  <div id="modalRoot"></div>
  <div id="itemsModalRoot"></div>
  <div id="powerScoreModalRoot"></div>

  <!-- File import input (moved outside sidebar) -->
  <input id="importFileInput" type="file" accept="application/json" style="display:none;" />

  <script type="module" src="./src/main.js"></script>
</body>
</html>
